name: Build CineMax Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Capacitor Android & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run lint

      - name: Build production web bundle for Android (root asset path)
        run: bun run build
        env:
          VITE_BASE_PATH: '/'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cinemax-kxpv.onrender.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Android web bundle uses root asset paths
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated"
            exit 1
          fi
          if grep -Fq '/CineMax/assets/' dist/index.html; then
            echo "Error: dist/index.html contains /CineMax/ base path instead of root /assets/ path"
            exit 1
          fi
          JS_ASSET=$(grep -Eo '/assets/[^"]+\.js' dist/index.html | head -n 1)
          if [ -z "$JS_ASSET" ] || [ ! -f "dist${JS_ASSET}" ]; then
            echo "Error: Expected root JS asset ($JS_ASSET) is missing in dist/assets/"
            exit 1
          fi
          echo "Verified Android web bundle asset: $JS_ASSET"

      - name: Add or sync Capacitor Android platform and launcher icons
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android
          node scripts/generate-android-icons.mjs

      - name: Build installable Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CineMax-debug.apk

      - name: Build and sign Release APK via Gradle (when signing secrets are configured)
        id: sign_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "All four Android release signing secrets detected. Building Gradle-signed Release APK..."
            KEYSTORE_TEMP_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/cinemax-release-XXXXXX.jks")"
            trap 'rm -f "$KEYSTORE_TEMP_FILE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE_TEMP_FILE"
            if [ ! -s "$KEYSTORE_TEMP_FILE" ]; then
              echo "Error: Decoded keystore temporary file is empty."
              exit 1
            fi
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_TEMP_FILE"
            (
              cd android
              ./gradlew assembleRelease --no-daemon
            )
            SIGNED_APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
            if [ ! -f "$SIGNED_APK_PATH" ]; then
              echo "Error: Expected Gradle-signed APK ($SIGNED_APK_PATH) was not produced."
              exit 1
            fi
            cp "$SIGNED_APK_PATH" CineMax-release-signed.apk
            if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
              BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
              "$BUILD_TOOLS_DIR/apksigner" verify --verbose CineMax-release-signed.apk
            fi
            rm -f "$KEYSTORE_TEMP_FILE"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping signed Release APK and providing installable Debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-Android-APK
          path: |
            CineMax-debug.apk
            CineMax-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK artifact
        if: steps.sign_release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-release-signed.apk
          path: CineMax-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ASSETS=("CineMax-debug.apk")
          if [ -f CineMax-release-signed.apk ]; then
            ASSETS+=("CineMax-release-signed.apk")
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "CineMax $TAG_NAME (Android APK)" \
              --generate-notes
          fi
