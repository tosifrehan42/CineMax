name: Build CineMax Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Capacitor Android & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run lint

      - name: Build production web bundle for Android (root asset path)
        run: bun run build
        env:
          VITE_BASE_PATH: '/'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cinemax-kxpv.onrender.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Android web bundle uses root asset paths
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated"
            exit 1
          fi
          if grep -Fq '/CineMax/assets/' dist/index.html; then
            echo "Error: dist/index.html contains /CineMax/ base path instead of root /assets/ path"
            exit 1
          fi
          JS_ASSET=$(grep -Eo '/assets/[^"]+\.js' dist/index.html | head -n 1)
          if [ -z "$JS_ASSET" ] || [ ! -f "dist${JS_ASSET}" ]; then
            echo "Error: Expected root JS asset ($JS_ASSET) is missing in dist/assets/"
            exit 1
          fi
          echo "Verified Android web bundle asset: $JS_ASSET"

      - name: Add or sync Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Build installable Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CineMax-debug.apk

      - name: Build and sign Release APK (when signing secrets are configured)
        id: sign_release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets detected. Building signed Release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/cinemax-release.jks
            cd android
            ./gradlew assembleRelease --no-daemon
            cd ..
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              /tmp/app-release-aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks /tmp/cinemax-release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out CineMax-release-signed.apk \
              /tmp/app-release-aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose CineMax-release-signed.apk
            rm -f /tmp/cinemax-release.jks /tmp/app-release-aligned.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping signed Release APK and providing installable Debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineMax-Android-APK
          path: |
            CineMax-debug.apk
            CineMax-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ASSETS="CineMax-debug.apk"
          if [ -f CineMax-release-signed.apk ]; then
            ASSETS="$ASSETS CineMax-release-signed.apk"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" $ASSETS --clobber
          else
            gh release create "$TAG_NAME" $ASSETS \
              --title "CineMax $TAG_NAME (Android APK)" \
              --generate-notes
          fi
