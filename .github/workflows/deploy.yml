name: Deploy CineMax to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run lint

      - name: Build production bundle for GitHub Pages
        run: bun run build
        env:
          VITE_BASE_PATH: '/CineMax/'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Verify production dist output and prepare SPA routing
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html was not generated by build"
            exit 1
          fi
          if grep -Eq '<script[^>]+src="[^"]*src/main\.tsx"' dist/index.html; then
            echo "Error: dist/index.html still contains an uncompiled /src/main.tsx script tag"
            exit 1
          fi
          if ! grep -Eq '<script[^>]+src="/CineMax/assets/[^"]+\.js"' dist/index.html; then
            echo "Error: dist/index.html does not reference compiled /CineMax/assets/*.js"
            exit 1
          fi
          if ! grep -Eq '<link[^>]+href="/CineMax/assets/[^"]+\.css"' dist/index.html; then
            echo "Error: dist/index.html does not reference compiled /CineMax/assets/*.css"
            exit 1
          fi
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
