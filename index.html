<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineMax - Premium Cinema & TV Discovery</title>
    <meta name="description" content="A modern, premium movie and TV show discovery web app with cinematic dark aesthetic, mood-based exploration, and personal watchlists." />
    <meta property="og:title" content="CineMax - Premium Cinema & TV Discovery" />
    <meta property="og:description" content="A modern, premium movie and TV show discovery web app with cinematic dark aesthetic, mood-based exploration, and personal watchlists." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090a0f] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var msg = event.message || 'Script initialization error';
          var src = event.filename ? ('\nSource: ' + event.filename + ':' + event.lineno) : '';
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090a0f;color:#f1f5f9;font-family:sans-serif;padding:24px;">' +
            '<div style="max-width:560px;width:100%;background:#141722;border:1px solid #334155;border-radius:12px;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,0.6);">' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
            '<div style="width:36px;height:36px;border-radius:8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:18px;font-weight:bold;">!</div>' +
            '<h2 style="font-size:18px;font-weight:700;margin:0;color:#f8fafc;">CineMax Initialization Notice</h2>' +
            '</div>' +
            '<p style="font-size:14px;color:#94a3b8;line-height:1.6;margin:0 0 16px 0;">An error occurred while loading the application bundle:</p>' +
            '<pre style="background:#090a0f;border:1px solid #1e293b;border-radius:8px;padding:12px;font-size:12px;color:#fca5a5;overflow-x:auto;white-space:pre-wrap;margin:0 0 20px 0;">' +
            msg + src + '</pre>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button onclick="window.location.reload()" style="background:#f59e0b;color:#090a0f;font-weight:600;font-size:13px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;">Reload CineMax</button>' +
            '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload()" style="background:#1e293b;color:#cbd5e1;font-weight:500;font-size:13px;padding:10px 18px;border-radius:8px;border:1px solid #334155;cursor:pointer;">Clear Cache & Reload</button>' +
            '</div>' +
            '</div>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
